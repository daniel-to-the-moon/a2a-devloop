name: Claude Fable-5 connectivity smoke
on:
  push:
    branches: [codex/claude-fable-smoke]
    paths: [.github/workflows/claude-fable-smoke.yml]
permissions: {}
jobs:
  messages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify one Anthropic Messages response
        env:
          LANYI_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -eu
          if [ -z "$LANYI_KEY" ]; then
            echo "::error::Neither ANTHROPIC_AUTH_TOKEN nor ANTHROPIC_API_KEY is available to the runner."
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          passed=0
          for model in claude-fable-5 claude-fable-5-1 claude-fable-5-2; do
            payload="$(jq -nc --arg model "$model" '{model:$model,max_tokens:64,messages:[{role:"user",content:"Reply with only OK."}]}')"
            code="$(curl --silent --show-error --max-time 45 --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $LANYI_KEY" \
              --header 'anthropic-version: 2023-06-01' \
              --header 'content-type: application/json' \
              --data "$payload" https://lanyiapi.com/v1/messages)"
            echo "$model HTTP $code"
            if [ "$code" = 200 ] && jq -e '.type == "message" and any(.content[]?; .type == "text" and (.text | length > 0))' "$response" >/dev/null; then
              echo "$model returned a Messages text response"
              passed=1
            else
              jq -r '(.error.code // .error.type // "unknown") as $v | if ($v | type) == "string" and ($v | test("^[a-z][a-z0-9_]{0,48}$")) then "Gateway error code: " + $v else "Gateway error code unavailable" end' "$response" 2>/dev/null || true
            fi
          done
          test "$passed" = 1
