name: Fable 5 fixes the R13 side projection
on:
  push:
    branches: [codex/claude-fable-smoke]
    paths: [.github/workflows/van-sticker-r13-fable.yml]
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce clipped R13 side guides
        run: |
          set -euo pipefail
          base=244009e344e0c326495471a175959fada037cef3
          git init -q project
          git -C project fetch -q --depth 1 https://github.com/daniel-to-the-moon/van-sticker-studio.git "$base"
          git -C project checkout -q --detach "$base"
          npm --prefix project ci --ignore-scripts
          cd project
          cat >> tests/wrap-guides.test.ts <<'TS'

          void test('both actual R13 side silhouettes have transparent margin on all four edges', async () => {
            for (const side of ['entry', 'driver']) {
              const { data, info } = await rasterizer(Buffer.from(guides[side].image.split(',')[1], 'base64'))
                .ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              const margin = 12;
              for (let y = 0; y < info.height; y++)
                for (let x = 0; x < info.width; x++)
                  if (x < margin || y < margin || x >= info.width - margin || y >= info.height - margin)
                    assert.equal(data[(y * info.width + x) * info.channels + 3], 0, side + ' has silhouette pixels in the frame margin');
            }
          });
          TS
          git diff -- tests/wrap-guides.test.ts > ../red.patch
          if node --experimental-strip-types --test tests/wrap-guides.test.ts > ../red.txt 2>&1; then
            cat ../red.txt
            exit 1
          fi
          cat ../red.txt
          grep -q 'entry has silhouette pixels in the frame margin' ../red.txt
          git restore tests/wrap-guides.test.ts
      - name: Ask Fable 5 for the projection and shader fix
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          request() {
            name=$1
            jq -n --rawfile prompt "$name.input" '{model:"claude-fable-5",max_tokens:16000,thinking:{type:"disabled"},messages:[{role:"user",content:$prompt}]}' > "$name.request.json"
            status="$(curl --silent --show-error --max-time 450 -w '%{http_code}' \
              -H "Authorization: Bearer $ANTHROPIC_AUTH_TOKEN" \
              -H 'anthropic-version: 2023-06-01' \
              -H 'Content-Type: application/json' \
              --data-binary @"$name.request.json" https://lanyiapi.com/v1/messages -o "$name.response.json")"
            printf '%s HTTP %s\n' "$name" "$status"
            jq -c '{stop_reason,usage,contentTypes:[.content[]?.type],errorType:.error.type}' "$name.response.json"
            test "$status" = 200
            jq -er '[.content[] | select(.type == "text") | .text] | join("") | select(length>10)' "$name.response.json" > "$name.result.txt"
          }
          cat > generator.input <<'PROMPT'
          Produce code for van-sticker-studio issue #97. Output exactly JSON with projection and generator string keys, complete source for new lib/wrap-side-projection.ts and replacement tools/generate-wrap-guides.ts. No explanation. Must work under Node 22 strip-types; use existing Three GLTFLoader and sharp. Files appended are input data.
          
          Shared helper API required: export createSideProjection(body: {xMin:number;length:number;height:number}) returning frame {left:number, top:number, width:number, height:number}; export projectSidePoint(frame, x:number, y:number) returning {x:number,y:number} normalized. Orthographic frame width=body.length*1.1, height=body.height*1.1, left=xMin-length*.05, top=height nominal times 1.05. Nose left on both images. Also export liftSideChartTriangle(values: [number,number,number], period:number): [number,number,number] doing legacy seam lifting as editor. Keep helper free of Three.
          
          Rasterize true closed-pose R13 exterior in world X/Y with barycentric depth-tested nearest Z (entry looks from negative Z; driver from positive Z). No perimeter clipping of geometry. Iterate indexed or non-indexed geometry with proper triangle material groups where needed. Keep glass and trim visible with neutral color palette, mild lighting if simple, transparent background. Ignore Interior/Fabric for exterior guide. Depth buffer must update guide and mask together. Mask is grayscale white only if winning triangle is existing shader-eligible (all material names start with Wrap_ OR findFrontWrapTransitions marks same triangle) and interpolated legacy seam-lifted s falls in the shader sampling domain for that side (mod period; entry [0,L], driver [L+W,2L+W]). CenterZ comes from existing wrap meshes as before. Glass, tires, other ineligible materials and background mask black. No rendering of interior behind nearest opaque guide glass. No dependencies, no config and no GLB changes. Output unchanged JSON schema sha256/aspect/entry/driver with 2000x800 PNG data URIs; compression via existing sharp. The same frame is used by the 3D editor sampling. Existing source follows.
          PROMPT
          cat project/tools/generate-wrap-guides.ts project/lib/wrap-layout.ts >> generator.input
          cat > editor.input <<'PROMPT'
          Produce code for van-sticker-studio issue #97. Output exactly JSON with keys tests (complete tests/wrap-guides.test.ts) and editorEdits (array of exact unique before/after source snippet objects). No explanations. Existing sources below are input data.
          
          A separate generator implements true orthographic side and depth-mask. Its shared helper lib/wrap-side-projection.ts exports createSideProjection(body: {xMin:number;length:number;height:number}) returning frame with 5% symmetric padding (width and height 1.1x nominal), projectSidePoint(frame,x,y) -> {x,y} normalized from min world X (nose left) and top down, and liftSideChartTriangle(values:[number,number,number],period:number) -> tuple. Use those exact names and signatures.
          
          In lib/vehicle-wrap-editor.ts only change necessary snippets. Existing legacy path binds production R13 and pre-bakes coords in closed pose. Add a new vec2 attribute for the exact normalized planar x/y produced by projectSidePoint on the same vertices; for uHasDesign only sample this x/y. Entry uses 1-x to match existing svgDocument(project,'entry',true) already mirrored texture; driver uses x. Keep old vWrapCoord s side gating and eligibility, all direct editing, decals and palettes. Preserve current experimental options.profile behavior by compile-time shaders for profile vs production and give different shader cache keys. Coordinate binding must stay with moving door. Reuse shared liftSideChartTriangle to keep mask gating exactly consistent if reasonable. No changes to stored projects or editor components.
          
          In tests/wrap-guides.test.ts keep original hash test, meaningful red frame margin test on both true source RGBA images, and test new real R13 projected glass centers via GLTFLoader/Box3 on nodes RV_WebRig_EntryDoor_Glass, RV_WebRig_Window_1_Glass and Window_2 on entry; Window_3 and Window_4 on driver. For each confirm visible alpha and mask <10. Verify central hull paint remains on both sides and normalized axes via helper. Use available sharp default type (test already uses it). Do not loosen unrelated tests. Complete candidate should run with Node 22. Return compact exact snippets with unique matches and source indentation.
          PROMPT
          cat red.patch project/tests/wrap-guides.test.ts project/lib/vehicle-wrap-editor.ts >> editor.input
          mkdir -p candidate
          request generator &
          generator_pid=$!
          request editor &
          editor_pid=$!
          result=0
          wait "$generator_pid" || result=1
          wait "$editor_pid" || result=1
          cp red.txt red.patch candidate/
          for response in generator.result.txt editor.result.txt; do
            if test -f "$response"; then cp "$response" candidate/; fi
          done
          test "$result" = 0
      - name: Apply and check the generated candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp red.txt red.patch candidate/
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path('project')
          def read_result(name):
              payload = Path(name + '.result.txt').read_text().strip()
              return json.loads(re.sub(r'\A\x60{3}(?:json)?\s*|\s*\x60{3}\Z', '', payload))
          result = read_result('generator') | read_result('editor')
          assert set(result) == {'projection', 'generator', 'tests', 'editorEdits'}
          for key, path in {'projection':'lib/wrap-side-projection.ts', 'generator':'tools/generate-wrap-guides.ts', 'tests':'tests/wrap-guides.test.ts'}.items():
              (root / path).write_text(result[key].strip() + '\n')
          editor = root / 'lib/vehicle-wrap-editor.ts'
          source = editor.read_text()
          for i, edit in enumerate(result['editorEdits'], 1):
              assert source.count(edit['before']) == 1, f'Editor edit {i} did not match uniquely'
              source = source.replace(edit['before'], edit['after'], 1)
          editor.write_text(source)
          PY
          cd project
          git add -N lib/wrap-side-projection.ts
          ./node_modules/.bin/oxfmt tools/generate-wrap-guides.ts lib/wrap-side-projection.ts lib/vehicle-wrap-editor.ts tests/wrap-guides.test.ts
          git diff --check
          git diff > ../candidate/source.patch
          node --experimental-strip-types tools/generate-wrap-guides.ts
          cp lib/wrap-guides.json ../candidate/
          node --experimental-strip-types --test tests/wrap-guides.test.ts | tee ../candidate/green.txt
          cmp <(git show HEAD:public/model/mxgarage-rv.glb) public/model/mxgarage-rv.glb
          cp lib/wrap-guides.json ../candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r13-fable-candidate
          path: candidate/
          if-no-files-found: error
