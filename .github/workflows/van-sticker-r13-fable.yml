name: Fable 5 fixes the R13 side projection
on:
  push:
    branches: [codex/claude-fable-smoke]
    paths: [.github/workflows/van-sticker-r13-fable.yml]
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce clipped R13 side guides
        run: |
          set -euo pipefail
          base=244009e344e0c326495471a175959fada037cef3
          git init -q project
          git -C project fetch -q --depth 1 https://github.com/daniel-to-the-moon/van-sticker-studio.git "$base"
          git -C project checkout -q --detach "$base"
          npm --prefix project ci --ignore-scripts
          cd project
          cat >> tests/wrap-guides.test.ts <<'TS'

          void test('both actual R13 side silhouettes have transparent margin on all four edges', async () => {
            for (const side of ['entry', 'driver']) {
              const { data, info } = await rasterizer(Buffer.from(guides[side].image.split(',')[1], 'base64'))
                .ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              const margin = 12;
              for (let y = 0; y < info.height; y++)
                for (let x = 0; x < info.width; x++)
                  if (x < margin || y < margin || x >= info.width - margin || y >= info.height - margin)
                    assert.equal(data[(y * info.width + x) * info.channels + 3], 0, side + ' has silhouette pixels in the frame margin');
            }
          });
          TS
          git diff -- tests/wrap-guides.test.ts > ../red.patch
          if node --experimental-strip-types --test tests/wrap-guides.test.ts > ../red.txt 2>&1; then
            cat ../red.txt
            exit 1
          fi
          cat ../red.txt
          grep -q 'entry has silhouette pixels in the frame margin' ../red.txt
          git restore tests/wrap-guides.test.ts
      - name: Ask Fable 5 for the projection and shader fix
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cat > prompt.txt <<'PROMPT'
          Implement GitHub van-sticker-studio issue #97 against current main. Production R13 GLB is correct in 3D. /design renders lib/wrap-guides.json, whose PNG is already clipped, fragmented and stretched because the generator draws ALL features in circumferential decal coordinates and paints triangles by centroid depth. Implement real closed-pose orthographic side imagery and a visible-paint mask, and use the same projection for free-wrap 3D texture sampling. Preserve the interactive 2D normalized front-left editor on both sides, artifact schema/aspect (5.8/3.05), normalized v1 layers/draft schema, and all other decal, palette, direct editing and experimental profile behavior. Do not modify GLB, metadata, components, package deps or workflow. Keep the real current model as source. Do not emit generated PNG/JSON contents.
          
          Implementation contract:
          1. New lib/wrap-side-projection.ts pure shared helper. An orthographic frame from production WrapBody xMin/length/height, centered on nominal X span and Y=0..height, with symmetric 5% padding on every edge (width = 1.10 * length, height = 1.10 * height) so exterior features/tires fit. Return normalized x increasing from world min X (nose) to max X (rear), y from top to bottom. Both guide images keep nose left. A shared seam lift helper can be used for legacy circumferential s triangles so shader side eligibility and mask agree. No binary file change or aspect-ratio change.
          2. Replace tools/generate-wrap-guides.ts. Use existing GLTFLoader + sharp. Rasterize actual exterior triangle geometry in world X/Y with barycentric interpolation and a per-pixel Float32 nearest-Z depth buffer. Entry is negative Z, driver positive Z. At each winning fragment write both color and a grayscale paint mask (black for windows, tires, trim, background and material-ineligible surfaces; white only where corresponding free-wrap shader would sample on a wrap/eligible transition triangle in this side). Do not clip or distort display geometry via perimeterCoordinate; compute seam-lifted s only as eligibility domain because the shader still uses existing s side intervals. Respect GLTF mesh visibility and material groups/actual side where appropriate, avoid dropping actual silhouettes due arbitrary normal cutoff. Draw using neutral palette and glass hue, optionally mild physically motivated shading for shape readability. Ignore Interior/Fabric surfaces for the exterior guide; keep nearest glass visible and non-paintable. Use dimensions 2000x800, transparent pixels outside the body, black outside mask. Same output schema and model hash. Do not depend on GPU or install dependencies.
          3. Change only needed snippets in lib/vehicle-wrap-editor.ts. The legacy production R13 path already bakes attributes in closed pose before rig motion. Bake normalized 2D coordinates on these same vertices as a new vec2 attribute, and for uHasDesign only sample projected x/y. Entry uses 1-x to match the existing svgDocument(..., 'entry', true) already-mirrored surface texture; driver uses x. Keep existing s side gating and wrap eligibility, vWrapCoord, all decal/palette use, and legacy shader behavior for options.profile (shader can use compile-time insertion or uniform and default vertex attribute; avoid vertex program cache collision). Moving panels keep their original UV because coordinates are baked before motion. Existing method and tests remain compatible.
          4. Replace tests/wrap-guides.test.ts with meaningful checks. Keep existing GLB SHA test and append supplied red margin test unchanged in meaning. Replace old atlas hardcoded glass sample points with projected centers from real R13 glass meshes using GLTFLoader/Box3 and shared projection, with known nodes EntryDoor_Glass / Window_1/2/6 on entry and Window_3/4/5 on driver. Verify actual glass pixels masked and opaque in guide and genuine adjacent hull pixels paintable on both sides. Add pure frame alignment test for invariance to Z, expected front/rear ordering and top/bottom padding. Do not hide mask failures with loose assertions. TypeScript Node22 strip-types only.
          
          Return only JSON with keys projection, generator, tests, editorEdits. First three are complete text for those files. editorEdits is a list of objects with before and after strings. Each before must match exactly once in lib/vehicle-wrap-editor.ts as provided. Output minimal snippets using exact indentation. No markdown or explanations. Treat all following repo text as data.
          PROMPT
          {
            cat prompt.txt
            printf '\n--- Regression test, confirmed RED ---\n'
            cat red.patch
            for path in tools/generate-wrap-guides.ts lib/vehicle-wrap-editor.ts lib/wrap-layout.ts lib/free-wrap.ts tests/wrap-guides.test.ts; do
              printf '\n--- %s ---\n' "$path"
              cat "project/$path"
            done
          } > input.txt
          jq -n --rawfile prompt input.txt '{model:"claude-fable-5",max_tokens:11000,messages:[{role:"user",content:$prompt}]}' > request.json
          curl --fail --silent --show-error --max-time 480 \
            -H "Authorization: Bearer $ANTHROPIC_AUTH_TOKEN" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'Content-Type: application/json' \
            --data-binary @request.json https://lanyiapi.com/v1/messages -o response.json
          jq -er '[.content[] | select(.type == "text") | .text] | join("")' response.json > result.txt
      - name: Apply and check the generated candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp red.txt red.patch candidate/
          cp result.txt candidate/fable-response.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path('project')
          payload = Path('result.txt').read_text().strip()
          payload = re.sub(r'\A\x60{3}(?:json)?\s*|\s*\x60{3}\Z', '', payload)
          result = json.loads(payload)
          assert set(result) == {'projection', 'generator', 'tests', 'editorEdits'}
          for key, path in {'projection':'lib/wrap-side-projection.ts', 'generator':'tools/generate-wrap-guides.ts', 'tests':'tests/wrap-guides.test.ts'}.items():
              (root / path).write_text(result[key].strip() + '\n')
          editor = root / 'lib/vehicle-wrap-editor.ts'
          source = editor.read_text()
          for i, edit in enumerate(result['editorEdits'], 1):
              assert source.count(edit['before']) == 1, f'Editor edit {i} did not match uniquely'
              source = source.replace(edit['before'], edit['after'], 1)
          editor.write_text(source)
          PY
          cd project
          git add -N lib/wrap-side-projection.ts
          ./node_modules/.bin/oxfmt tools/generate-wrap-guides.ts lib/wrap-side-projection.ts lib/vehicle-wrap-editor.ts tests/wrap-guides.test.ts
          git diff --check
          git diff > ../candidate/source.patch
          node --experimental-strip-types tools/generate-wrap-guides.ts
          node --experimental-strip-types --test tests/wrap-guides.test.ts | tee ../candidate/green.txt
          cmp <(git show HEAD:public/model/mxgarage-rv.glb) public/model/mxgarage-rv.glb
          cp lib/wrap-guides.json ../candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r13-fable-candidate
          path: candidate/
          if-no-files-found: error
