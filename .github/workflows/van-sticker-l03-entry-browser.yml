name: Verify L03 design entry and drag placement in Chromium
on:
  push:
    branches: [codex/claude-fable-smoke]
    paths: [.github/workflows/van-sticker-l03-entry-browser.yml]
permissions: {}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact PR commit and Chromium
        run: |
          set -euo pipefail
          head=f52eae83d2052e975ce15852cbe7a57b03e17edd
          git init -q project
          git -C project fetch --quiet --depth 1 https://github.com/daniel-to-the-moon/van-sticker-studio.git "$head"
          git -C project checkout -q --detach FETCH_HEAD
          test "$(git -C project rev-parse HEAD)" = "$head"
          mkdir -p evidence
          printf 'van-sticker-studio PR #96\ncommit %s\n' "$head" > evidence/commit.txt
          npm --prefix project ci
          npm install --prefix "$RUNNER_TEMP/l03-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/l03-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open the studio and verify placement
        run: |
          set -euo pipefail
          cat > browser.cjs <<'TEST'
          const assert = require('node:assert/strict');
          const { chromium } = require(process.env.RUNNER_TEMP + '/l03-browser/node_modules/playwright');
          async function main() {
            const browser = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            try {
              const page = await browser.newPage({ viewport: { width: 1400, height: 980 } });
              page.on('pageerror', (error) => console.error('Browser script error:', error.message));
              page.on('console', (message) => { if (message.type() === 'error') console.error('Browser console:', message.text()); });
              const response = await page.goto('http://localhost:4173/design');
              assert.equal(response.status(), 200);
              const editor = page.getByRole('application', { name: '车身贴画编辑器' });
              await editor.waitFor({ timeout: 15000 });
              const entry = page.getByRole('link', { name: '室内布局（示例）', exact: true });
              await entry.waitFor();
              await page.getByText('正在恢复草稿', { exact: true }).waitFor({ state: 'hidden', timeout: 15000 });
              await page.screenshot({ path: 'evidence/studio-entry.png', timeout: 15000 });
              await Promise.all([page.waitForURL('**/interior-layout'), entry.click()]);
              await page.getByRole('heading', { name: '室内布局草图', exact: true }).waitFor();
              await page.getByText('交互示例：尺寸仅用于演示，非实际车辆测量数据', { exact: true }).waitFor();
              await page.getByRole('link', { name: '返回首页' }).waitFor();
              const palette = page.getByTestId('fixture-palette');
              const board = page.getByTestId('layout-board');
              const preview = page.getByTestId('placement-preview');
              const status = page.getByTestId('placement-status');
              const placed = page.getByTestId('placed-fixture');
              await palette.waitFor({ timeout: 12000 });
              try {
                await page.waitForFunction(() => {
                  const button = document.querySelector('[data-testid="fixture-palette"]');
                  return button && Object.keys(button).some((key) => key.startsWith('__reactProps'));
                }, null, { timeout: 12000 });
              } catch (error) {
                await page.screenshot({ path: 'evidence/hydration-failure.png' });
                throw error;
              }
              const original = await placed.first().boundingBox();
              assert.equal(await placed.count(), 1);
              async function drag(x, y) {
                await palette.hover({ timeout: 5000 });
                const target = await board.boundingBox();
                await page.mouse.down();
                await page.mouse.move(target.x + target.width * x / 5000, target.y + target.height * y / 2000, { steps: 8 });
                try {
                  await preview.waitFor({ timeout: 8000 });
                } catch (error) {
                  console.error('Preview count:', await preview.count(), 'Status:', await status.innerText());
                  await page.screenshot({ path: 'evidence/drag-failure.png' });
                  throw error;
                }
              }
              async function invalid(x, y, reason, screenshot) {
                await drag(x, y);
                assert.equal(await preview.getAttribute('data-valid'), 'false');
                assert.match(await status.innerText(), reason);
                if (screenshot) await page.screenshot({ path: 'evidence/invalid-preview.png' });
                await page.mouse.up();
                await preview.waitFor({ state: 'detached' });
                assert.equal(await placed.count(), 1);
                assert.deepEqual(await placed.first().boundingBox(), original);
              }
              await invalid(1100, 600, /碰撞|重叠|冲突/, true);
              await invalid(3100, 150, /净空|开口/);
              await invalid(4800, 1850, /越界|超出/);
              await drag(5100, 1500);
              assert.equal(await preview.getAttribute('data-valid'), 'false');
              assert.match(await status.innerText(), /越界|超出/);
              const outside = await preview.boundingBox();
              const layout = await board.boundingBox();
              assert.ok(outside.x > layout.x + layout.width);
              assert.equal(await preview.evaluate((el) => {
                for (let parent = el.parentElement; parent; parent = parent.parentElement) {
                  if (getComputedStyle(parent).overflowX === 'hidden') return false;
                }
                return true;
              }), true);
              await page.mouse.up();
              await preview.waitFor({ state: 'detached' });
              assert.equal(await placed.count(), 1);
              await drag(200, 1100);
              assert.equal(await preview.getAttribute('data-valid'), 'true');
              const opacity = await preview.evaluate((el) => Number(getComputedStyle(el).opacity));
              assert.ok(opacity > 0 && opacity < 0.7, 'preview must be translucent');
              await page.screenshot({ path: 'evidence/valid-preview.png' });
              await page.mouse.up();
              await preview.waitFor({ state: 'detached' });
              assert.equal(await placed.count(), 2);
              assert.deepEqual(await placed.first().boundingBox(), original);
              await drag(4000, 1000);
              await page.keyboard.press('Escape');
              await preview.waitFor({ state: 'detached' });
              await page.mouse.up();
              assert.equal(await placed.count(), 2);
              await palette.focus();
              await page.keyboard.press('Space');
              await preview.waitFor();
              await page.keyboard.press('Tab');
              await preview.waitFor({ state: 'detached' });
              assert.equal(await placed.count(), 2);
              await palette.focus();
              await page.keyboard.press('Space');
              await preview.waitFor();
              await page.keyboard.press('ArrowRight');
              await page.keyboard.press('Space');
              await preview.waitFor({ state: 'detached' });
              assert.equal(await placed.count(), 3);
              assert.deepEqual(await placed.first().boundingBox(), original);
              await page.screenshot({ path: 'evidence/after-drop.png' });
              const back = page.getByRole('link', { name: '返回设计工作台' });
              await Promise.all([page.waitForURL('**/design'), back.click()]);
              await editor.waitFor({ timeout: 15000 });
              await entry.waitFor();
              await page.getByText('正在恢复草稿', { exact: true }).waitFor({ state: 'hidden', timeout: 15000 });
              await page.getByRole('button', { name: '另一侧', exact: true }).click();
              assert.equal(await page.getByRole('button', { name: '另一侧', exact: true }).getAttribute('aria-pressed'), 'true');
              await page.getByRole('button', { name: '咖啡杯', exact: true }).click();
              await page.getByRole('heading', { name: '图层 · 1', exact: true }).waitFor();
              const narrow = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await narrow.goto('http://localhost:4173/design');
              const narrowEntry = narrow.getByRole('link', { name: '室内布局（示例）', exact: true });
              await narrowEntry.waitFor();
              await narrow.keyboard.press('Tab');
              assert.equal(await narrowEntry.evaluate((el) => document.activeElement === el && getComputedStyle(el).boxShadow !== 'none'), true);
              await Promise.all([narrow.waitForURL('**/interior-layout'), narrow.keyboard.press('Enter')]);
              const home = narrow.getByRole('link', { name: '返回首页' });
              const backOnNarrow = narrow.getByRole('link', { name: '返回设计工作台' });
              const warning = narrow.getByText('交互示例：尺寸仅用于演示，非实际车辆测量数据', { exact: true });
              await warning.waitFor();
              for (const element of [home, backOnNarrow, warning]) {
                const rect = await element.boundingBox();
                assert.ok(rect && rect.x >= 0 && rect.x + rect.width <= 390);
              }
              await home.focus();
              await narrow.keyboard.press('Tab');
              assert.equal(await backOnNarrow.evaluate((el) => document.activeElement === el && el.matches(':focus-visible') && parseFloat(getComputedStyle(el).outlineWidth) > 0), true);
              await narrow.screenshot({ path: 'evidence/narrow-layout.png' });
              await Promise.all([narrow.waitForURL('**/design'), narrow.keyboard.press('Enter')]);
              await narrow.getByRole('application', { name: '车身贴画编辑器' }).waitFor();
              console.log('GREEN: keyboard navigation and visible focus at 390 px, return to editor, switch vehicle side and add sticker.');
              console.log('GREEN: studio entry, sample disclaimer, return to editor, collision, opening clearance, bounds, outside-board preview, valid drop, Escape, keyboard blur and keyboard placement; original furniture position preserved.');
            } finally { await browser.close(); }
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          TEST
          (cd project && exec ./node_modules/.bin/vinext dev --host localhost --port 4173) > evidence/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl -s --noproxy "*" --max-time 5 http://localhost:4173/interior-layout >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat evidence/server.log; exit 1; fi
          node browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l03-entry-browser-evidence
          path: evidence/
          if-no-files-found: error
